# ═══════════════════════════════════════════════════════════════
# GOEIC Enterprise Assistant — Full Stack
#
# Services:
#   1. ollama   — local LLM server (GPU, qwen2.5:72b)
#   2. weaviate — vector database (persistent local volume)
#   3. app      — FastAPI + Embeddings + Whisper (GPU-enabled)
#
# Quick start (first time):
#   docker compose up -d
#   docker exec -it goeic-ollama ollama pull qwen2.5:72b
#
# GPU requires nvidia-container-toolkit on host.
# To run CPU-only: remove all deploy: blocks below.
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ─────────────────────────────────────────────────────────────
  # 1. OLLAMA — Local LLM Server (GPU)
  #    Runs qwen2.5:72b on GPU — completely separate from app
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: goeic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama        # persists downloaded models
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - goeic_net

  # ─────────────────────────────────────────────────────────────
  # 2. WEAVIATE — Vector Database
  #    Data stored at your local Windows path
  # ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.27.2
    container_name: goeic-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - "D:\\my main laptop\\out projects\\Abdelwahab Project\\app\\app\\GOEIC_Chatbot_V2\\weaviate_data:/var/lib/weaviate"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      ASYNC_INDEXING: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - goeic_net

  # ─────────────────────────────────────────────────────────────
  # 3. APP — GOEIC FastAPI Application
  #    ✅ GPU-enabled: embeddings + Whisper run on GPU
  #    ✅ Models pre-baked into image (zero download on startup)
  #    ✅ Port 8000
  # ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/${GITHUB_REPOSITORY:-your-org/goeic}/goeic-offline:latest
    # Or build locally:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.offline
    container_name: goeic-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs              # persist logs across restarts
      - app_uploads:/app/uploads        # persist uploaded Excel files
      - ./public:/app/public:ro         # serve static files (read-only)
      # NOTE: NO whisper_cache or HF_cache volumes here.
      # Both models are baked INTO the image — no external cache needed.
    env_file:
      - .env
    environment:
      # These override .env — point to other containers by service name
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:72b"
      WEAVIATE_HOST: "weaviate"
      OLLAMA_TIMEOUT: "300"
    # ── GPU access for embeddings + Whisper ──────────────────
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ─────────────────────────────────────────────────────────
    depends_on:
      ollama:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - goeic_net

# ─────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
  # weaviate_data is a bind mount (Windows path) — no named volume needed
  app_logs:
    driver: local
  app_uploads:
    driver: local

# ─────────────────────────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────────────────────────
networks:
  goeic_net:
    driver: bridge