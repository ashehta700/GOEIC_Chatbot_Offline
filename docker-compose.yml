# ═══════════════════════════════════════════════════════════════
# GOEIC Enterprise Assistant — Full Stack
# GPU: RTX 5090 (31.8GB VRAM)
# ═══════════════════════════════════════════════════════════════

version: "3.9"

services:

  # ─────────────────────────────────────────────────────────────
  # 1. OLLAMA — Local LLM Server (GPU)
  #
  #    GPU syntax: deploy.resources.reservations.devices
  #    NOT "gpus: all" — that is docker run syntax, not compose.
  #
  #    qwen2.5:32b  → ~20GB → fits fully in RTX 5090 (31.8GB) ✅
  #    qwen2.5:72b  → ~41GB → splits: 47 layers GPU + rest CPU ⚠️
  # ─────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: goeic-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_GPU_OVERHEAD=0
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_REQUEST_TIMEOUT=300
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # ── Healthcheck: check once per 2 minutes, not every 30s ──
    # Ollama is slow to start with a large model loaded.
    # Frequent checks add log noise and waste CPU.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 2m        # check every 2 minutes
      timeout: 10s
      retries: 3
      start_period: 2m    # give Ollama 2 min to start before first check
    networks:
      - goeic_net

  # ─────────────────────────────────────────────────────────────
  # 2. WEAVIATE — Vector Database
  # ─────────────────────────────────────────────────────────────
  weaviate:
    image: semitechnologies/weaviate:1.27.2
    container_name: goeic-weaviate
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - "C:\\Users\\pc\\Downloads\\weaviate_data\\weaviate_data:/var/lib/weaviate"
    environment:
      QUERY_DEFAULTS_LIMIT: "25"
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
      ASYNC_INDEXING: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/.well-known/ready"]
      interval: 2m
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - goeic_net

  # ─────────────────────────────────────────────────────────────
  # 3. APP — FastAPI + Embeddings + Whisper (GPU, CUDA 12.8)
  # ─────────────────────────────────────────────────────────────
  app:
    image: ghcr.io/ashehta700/goeic_chatbot_offline/goeic-offline:latest
    container_name: goeic-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
      - ./public:/app/public:ro
    env_file:
      - "C:/Users/pc/Downloads/GOEIC_Chatbot_Offline-main (1)/GOEIC_Chatbot_Offline-main/.env"
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "qwen2.5:72b"
      WEAVIATE_HOST: "weaviate"
      OLLAMA_TIMEOUT: "300"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama:
        condition: service_healthy
      weaviate:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 2m
      timeout: 15s
      retries: 3
      start_period: 3m    # app waits for both Ollama + Weaviate first
    networks:
      - goeic_net

# ─────────────────────────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    driver: local
  app_logs:
    driver: local
  app_uploads:
    driver: local

networks:
  goeic_net:
    driver: bridge