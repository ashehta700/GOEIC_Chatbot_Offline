name: Build and Push GOEIC Offline Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:             # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ─────────────────────────────────────────
      - name: Checkout Code
        uses: actions/checkout@v4

      # ── 2. Lowercase repo name (required for GHCR) ──────────
      - name: Sanitize repo slug
        id: repo_slug
        run: |
          echo "result=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # ── 3. Free up disk space ────────────────────────────────
      # The CUDA base image is large (~5GB). GitHub runners have ~14GB free.
      # This step removes unused tools to make room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      # ── 4. Docker Buildx ────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 5. Login to GitHub Container Registry ───────────────
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Derive image tags ─────────────────────────────────
      - name: Set image tags
        id: tags
        run: |
          REPO="ghcr.io/${{ steps.repo_slug.outputs.result }}/goeic-offline"
          SHA_SHORT="${GITHUB_SHA::7}"
          echo "latest=${REPO}:latest" >> "$GITHUB_OUTPUT"
          echo "sha=${REPO}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"

      # ── 7. Build & Push ──────────────────────────────────────
      # CUDA image: GPU-enabled for embeddings + Whisper in the app container.
      # Ollama handles LLM GPU inference in its own container.
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.offline
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            EMBEDDING_MODEL=paraphrase-multilingual-mpnet-base-v2
            WHISPER_MODEL_SIZE=base

      # ── 8. Print deployment info ─────────────────────────────
      - name: Print deployment info
        run: |
          echo "✅ Image pushed successfully"
          echo ""
          echo "Image includes:"
          echo "  - CUDA 12.1 + cuDNN 8 (GPU support)"
          echo "  - Embedding model: paraphrase-multilingual-mpnet-base-v2 (baked in)"
          echo "  - Whisper model: base (baked in)"
          echo "  - FFmpeg for audio processing"
          echo ""
          echo "Pull with:"
          echo "  docker pull ${{ steps.tags.outputs.latest }}"
          echo ""
          echo "Update running stack:"
          echo "  docker compose pull app && docker compose up -d app"
          echo ""
          echo "After first start, pull the LLM model:"
          echo "  docker exec -it goeic-ollama ollama pull qwen2.5:72b"